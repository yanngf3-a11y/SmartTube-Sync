name: Generar keystore (uso único)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Contraseña del keystore (elegila vos, anotala)"
        required: true
      key_password:
        description: "Contraseña de la clave (puede ser la misma de arriba)"
        required: true
      key_alias:
        description: "Alias de la clave (ej: ygsync)"
        required: true
        default: "ygsync"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar el keystore
        run: |
          keytool -genkeypair -v \
            -keystore key.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=YG Sync, OU=YG Sync, O=YG Sync, L=City, S=State, C=US"

      - name: Codificar en base64
        run: base64 -w 0 key.jks > key.jks.base64.txt

      - name: Subir el keystore como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystore-generado
          path: |
            key.jks
            key.jks.base64.txt
          retention-days: 1
